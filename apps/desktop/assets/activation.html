<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>奉中附小 DSH</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,#dbeafe,transparent 38%),linear-gradient(145deg,#f8fbff,#e7f0ff);font-family:"Microsoft YaHei UI",system-ui,sans-serif;color:#10234a}.card{width:min(580px,calc(100vw - 48px));background:rgba(255,255,255,.94);border:1px solid #c9dcfb;border-radius:30px;padding:52px;box-shadow:0 28px 90px rgba(30,64,175,.15)}.brand{font-size:14px;font-weight:800;letter-spacing:.08em;color:#2563eb}.mark{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:#2563eb;color:white;font-size:28px;margin-bottom:28px}h1{font-size:34px;margin:8px 0 14px}p{color:#52637f;line-height:1.7}.status{min-height:58px;margin:28px 0 18px;padding:16px 18px;border-radius:16px;background:#f1f5fb;color:#405473}.status.error{background:#fff0f0;color:#b42318}.status.busy{background:#edf4ff;color:#1d4ed8}button{width:100%;border:0;border-radius:16px;padding:16px 20px;font-size:17px;font-weight:800;background:#2563eb;color:white;cursor:pointer;box-shadow:0 12px 26px rgba(37,99,235,.24)}button:disabled{opacity:.55;cursor:wait}.note{font-size:13px;margin-top:18px;color:#71809a}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">鲸</div>
    <div class="brand">奉中附小 DSH</div>
    <h1>连接你的工作空间</h1>
    <p>使用单位统一身份认证激活当前 Windows 设备。激活成功后，本地 DSH 可离线使用 30 天，并自动同步管理员提供的模型。</p>
    <div id="status" class="status">正在检查设备授权…</div>
    <button id="activate" type="button">使用单位账号登录</button>
    <div class="note">个人项目和会话只保存在这台电脑；单位模型密钥由 Windows DPAPI 加密。</div>
  </main>
  <script>
    const status = document.querySelector('#status')
    const button = document.querySelector('#activate')
    button.addEventListener('click', () => window.desktop.activate())
    window.desktop.onStatus(next => {
      status.textContent = next.message
      status.className = `status ${next.kind}`
      button.disabled = next.kind === 'busy'
    })
  </script>
</body>
</html>
